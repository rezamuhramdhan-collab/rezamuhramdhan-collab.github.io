<svg xmlns="http://www.w3.org/2000/svg" width="1104" height="690" viewBox="0 0 1104 690" role="img" aria-labelledby="title desc">
  <title id="title">Design SystemQu token architecture</title>
  <desc id="desc">Raw values flow into reusable aliases and then into semantic product roles consumed by components.</desc>
  <rect width="1104" height="690" rx="24" fill="#f5f7fb"/>
  <text x="64" y="76" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">A layered source of truth</text>
  <text x="64" y="106" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Components consume intent, not literal values.</text>

  <g transform="translate(64 164)">
    <rect width="272" height="344" rx="20" fill="#ffffff" stroke="#dbe3ef"/>
    <circle cx="38" cy="40" r="18" fill="#e8efff"/>
    <text x="38" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2257f2">01</text>
    <text x="28" y="94" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Raw</text>
    <text x="28" y="122" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Base values</text>
    <rect x="28" y="160" width="216" height="42" rx="10" fill="#2257f2"/>
    <text x="45" y="186" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">blue / 600</text>
    <rect x="28" y="216" width="216" height="42" rx="10" fill="#f0f3f8"/>
    <text x="45" y="242" font-family="Arial, sans-serif" font-size="13" fill="#334155">space / 16</text>
    <rect x="28" y="272" width="216" height="42" rx="10" fill="#f0f3f8"/>
    <text x="45" y="298" font-family="Arial, sans-serif" font-size="13" fill="#334155">radius / full</text>
  </g>

  <path d="M358 336h48" stroke="#2257f2" stroke-width="3" stroke-linecap="round"/>
  <path d="m396 328 10 8-10 8" fill="none" stroke="#2257f2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(416 164)">
    <rect width="272" height="344" rx="20" fill="#ffffff" stroke="#dbe3ef"/>
    <circle cx="38" cy="40" r="18" fill="#e8efff"/>
    <text x="38" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2257f2">02</text>
    <text x="28" y="94" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Alias</text>
    <text x="28" y="122" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Reusable roles</text>
    <rect x="28" y="160" width="216" height="42" rx="10" fill="#eef3ff"/>
    <text x="45" y="186" font-family="Arial, sans-serif" font-size="13" fill="#2257f2">brand / primary</text>
    <rect x="28" y="216" width="216" height="42" rx="10" fill="#f0f3f8"/>
    <text x="45" y="242" font-family="Arial, sans-serif" font-size="13" fill="#334155">layout / inset-md</text>
    <rect x="28" y="272" width="216" height="42" rx="10" fill="#f0f3f8"/>
    <text x="45" y="298" font-family="Arial, sans-serif" font-size="13" fill="#334155">control / pill</text>
  </g>

  <path d="M710 336h48" stroke="#2257f2" stroke-width="3" stroke-linecap="round"/>
  <path d="m748 328 10 8-10 8" fill="none" stroke="#2257f2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

